name: Share a project
description: Add a civic tech project to the OpenBayan directory. A pull request is opened for you.
title: 'Share a project: '
body:
  - type: markdown
    attributes:
      value: |
        You do not need to write code to share a project. Fill in what you know. After you submit, a pull request is opened and a maintainer reviews it.
  - type: input
    id: name
    attributes:
      label: Project name
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: One-line summary
      description: Up to 240 characters. This shows in the directory list.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What it does and who it helps
      description: Up to 1,200 characters of plain text.
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Stage
      options:
        - Planning
        - Alpha
        - Beta
        - Stable
    validations:
      required: true
  - type: dropdown
    id: sector
    attributes:
      label: Main sector
      options:
        - Government
        - Local Government
        - Transparency
        - Civic Tech
        - Technology
        - Finance
        - Health
        - Education
        - Climate
        - Disaster Management
        - Public Safety
        - Infrastructure
        - Civil Society
        - Security
        - Other
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Website
      description: Where people can see or use it. Leave empty if there is none yet.
      placeholder: https://
  - type: input
    id: repository
    attributes:
      label: Source code
      description: Leave empty if the project has no public code.
      placeholder: https://github.com/
  - type: input
    id: license
    attributes:
      label: License
      placeholder: MIT
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Up to 8, separated by commas.
      placeholder: open-data, mapping
  - type: input
    id: maintainers
    attributes:
      label: Maintainers
      description: Names of the people or group behind it, separated by commas.
